<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi jornada</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<main class="movil">
  <div class="d-flex align-items-center mb-2">
    <span class="marca"><i class="bi bi-truck"></i> Mi jornada</span>
    <span class="ms-auto small text-secondary text-truncate ps-2" style="max-width: 60%" data-usuario></span>
    <button class="btn btn-sm btn-link text-secondary" onclick="salir()" title="Salir"><i class="bi bi-box-arrow-right"></i></button>
  </div>

  <!-- ===================== M4 MAPA ===================== -->
  <section id="vista-mapa" class="vista">
    <div id="mapa" class="mapa-completo"></div>
  </section>

  <!-- ===================== REGISTRAR ===================== -->
  <section id="vista-registro" class="vista d-none">
    <div class="btn-group w-100 mb-3" role="group">
      <input type="radio" class="btn-check" name="que" id="que-mov" checked>
      <label class="btn btn-outline-primary" for="que-mov"><i class="bi bi-box-seam"></i> Movimiento</label>
      <input type="radio" class="btn-check" name="que" id="que-arrojo">
      <label class="btn btn-outline-danger" for="que-arrojo"><i class="bi bi-exclamation-octagon"></i> Arrojo en la vía</label>
    </div>
    <div class="tarjeta">
      <div class="fw-semibold mb-2" id="r-donde">¿Dónde se recoge?</div>
      <div id="r-ubicacion"></div>
    </div>
    <div class="tarjeta">
      <div id="r-solo-mov">
        <label class="form-label small" for="r-obra">Origen</label>
        <select class="form-select mb-2" id="r-obra"></select>
        <label class="form-label small" for="r-placa">Placa</label>
        <input class="form-control placa-input mb-2" id="r-placa" maxlength="8" placeholder="ABC456">
      </div>
      <div class="small text-secondary">Material</div>
      <div id="r-tipos" class="mb-2"></div>
      <label class="form-label small" for="r-volumen">Volumen (m³)</label>
      <input class="form-control mb-2" id="r-volumen" type="number" step="0.5" min="0.5" value="6">
      <label class="btn btn-outline-primary w-100"><i class="bi bi-camera"></i> Foto
        <input type="file" accept="image/*" capture="environment" id="r-foto" hidden></label>
      <div class="small text-success mt-1" id="r-foto-ok"></div>
    </div>
    <button class="btn btn-primary btn-xl" id="r-guardar">Guardar</button>
    <div id="r-resultado" class="mt-3"></div>
  </section>

  <!-- ===================== M6 VIAJES Y DATOS ===================== -->
  <section id="vista-viajes" class="vista d-none">
    <div class="row g-2 mb-2">
      <div class="col-6"><select class="form-select form-select-sm" id="f-estado">
        <option value="">Todos los estados</option><option value="abierto">Abiertos</option><option value="rechazado">Rechazados</option>
        <option value="cerrado">Cerrados</option><option value="cerrado_faltante">Con faltante</option>
        <option value="sin_cierre">Sin cierre</option><option value="anulado">Anulados</option></select></div>
      <div class="col-6"><select class="form-select form-select-sm" id="f-obra"><option value="">Todas las obras</option></select></div>
      <div class="col-6"><input class="form-control form-control-sm" type="date" id="f-desde" title="Desde"></div>
      <div class="col-6"><input class="form-control form-control-sm" type="date" id="f-hasta" title="Hasta"></div>
    </div>
    <div id="viajes-lista" class="mb-3"></div>
  </section>

  <section id="vista-datos" class="vista d-none">
    <div class="tarjeta"><div class="fw-semibold mb-2">m³ por tipo de material</div><canvas id="grafico-tipos" height="220"></canvas></div>
    <div class="tarjeta">
      <div class="fw-semibold mb-2">Avance por obra · meta de aprovechamiento</div>
      <div id="tabla-obras"></div>
      <div class="small text-secondary mt-2">En peso, sin productos de excavación (Res. 0472, art. 19).</div>
    </div>
  </section>
</main>

<button class="btn btn-primary boton-flotante" id="nuevo"><i class="bi bi-plus-lg"></i> Nuevo registro</button>

<nav class="barra-inferior">
  <button class="activo" data-vista="mapa"><i class="bi bi-map"></i>Mapa</button>
  <button data-vista="viajes"><i class="bi bi-list-ul"></i>Viajes</button>
  <button data-vista="datos"><i class="bi bi-bar-chart"></i>Datos</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="/js/comun.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let mapa, selector, tipoMaterial, grafico, obras = [];

  // ---------------------------------------------------- navegación
  function ver(vista) {
    document.querySelectorAll('[data-vista]').forEach((x) => x.classList.toggle('activo', x.dataset.vista === vista));
    document.querySelectorAll('.vista').forEach((v) => v.classList.toggle('d-none', v.id !== `vista-${vista}`));
    $('nuevo').classList.toggle('d-none', vista !== 'mapa');
    if (vista === 'mapa') setTimeout(() => mapa.invalidateSize(), 50);
    if (vista === 'registro') setTimeout(() => selector.refrescar(), 50);
    if (vista === 'viajes') cargarViajes();
    if (vista === 'datos') cargarDatos();
  }
  document.querySelectorAll('[data-vista]').forEach((b) => (b.onclick = () => ver(b.dataset.vista)));
  $('nuevo').onclick = () => ver('registro');

  // ---------------------------------------------------- M4: mapa con 3 visualizaciones + capas de referencia
  const COLOR_OBRA = { activa: '#1f7a4d', suspendida: '#b26a00', terminada: '#777' };
  async function cargarMapa() {
    mapa = mapaBase('mapa');
    const [norma, obrasGeo, movs, arrojos] = await Promise.all([
      get('/api/mapas/normativa'), get('/api/mapas/obras'), get('/api/mapas/movimientos'), get('/api/mapas/arrojos')]);

    const tematico = L.geoJSON(obrasGeo, {   // 1. mapa temático: obras por estado
      pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 9, color: '#fff', weight: 2, fillOpacity: 0.95,
                                                    fillColor: COLOR_OBRA[f.properties.estado] }),
      onEachFeature: (f, l) => l.bindPopup(`<b>${esc(f.properties.nombre)}</b><br>Estado: ${esc(f.properties.estado)}<br>
        Movimientos en curso: ${f.properties.movimientos_en_curso}`),
    });
    const puntos = movs.features.map((f) => [f.geometry.coordinates[1], f.geometry.coordinates[0], f.properties.m3]);
    const maxM3 = Math.max(1, ...puntos.map((p) => p[2]));
    const calor = L.heatLayer(puntos.map(([la, lo, m3]) => [la, lo, m3 / maxM3]), { radius: 28, blur: 22 });   // 2. calor de m³
    const cluster = L.markerClusterGroup();                                                                    // 3. clúster
    movs.features.forEach((f) => cluster.addLayer(L.marker([f.geometry.coordinates[1], f.geometry.coordinates[0]])
      .bindPopup(`<b>${esc(f.properties.codigo)}</b> ${chip(f.properties.estado)}<br>${num(f.properties.m3)} m³ · ${esc(f.properties.placa)}`)));
    const arrojosCapa = L.geoJSON(arrojos, {
      pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 7, color: '#b42318', fillColor: '#b42318', fillOpacity: 0.7 }),
      onEachFeature: (f, l) => l.bindPopup(`<b>Arrojo</b> · ${num(f.properties.m3)} m³<br>${fecha(f.properties.reportado_en)}<br>
        Movimientos sin cerrar cerca: ${f.properties.movimientos_cercanos}`),
    });
    const normativa = capaNormativa(norma);

    tematico.addTo(mapa); normativa.addTo(mapa);
    const wms = await capasWMS();
    L.control.layers(null, {
      'Mis obras (por estado)': tematico, 'Calor de m³': calor, 'Clúster de movimientos': cluster,
      'Receptores y zonas prohibidas': normativa, 'Arrojos reportados': arrojosCapa, ...wms,
    }, { collapsed: true }).addTo(mapa);
    const leyenda = L.control({ position: 'bottomleft' });
    leyenda.onAdd = () => Object.assign(L.DomUtil.create('div', 'leyenda'), { innerHTML:
      Object.entries(COLOR_OBRA).map(([k, c]) => `<span class="punto" style="background:${c}"></span>Obra ${k}`).join('<br>') +
      '<br><span class="punto" style="background:#1f7a4d;border-radius:2px"></span>Receptor inscrito' +
      '<br><span class="punto" style="background:#b42318;border-radius:2px"></span>Zona prohibida' });
    leyenda.addTo(mapa);
    if (obrasGeo.features.length) mapa.fitBounds(tematico.getBounds().pad(0.6));
  }

  // ---------------------------------------------------- registrar movimiento o arrojo
  const esArrojo = () => $('que-arrojo').checked;
  $('que-mov').onchange = $('que-arrojo').onchange = () => {
    $('r-solo-mov').classList.toggle('d-none', esArrojo());
    $('r-donde').textContent = esArrojo() ? '¿Dónde está el arrojo?' : '¿Dónde se recoge?';
    $('r-resultado').innerHTML = '';
  };
  $('r-foto').onchange = (e) => ($('r-foto-ok').textContent = e.target.files.length ? '✓ Foto lista' : '');
  $('r-obra').onchange = () => {
    const o = obras.find((x) => String(x.id) === $('r-obra').value);
    if (o) selector.mapa.setView([o.lat, o.lon], 17);
  };

  $('r-guardar').onclick = async () => {
    try {
      const u = selector.obtener();
      const d = new FormData();
      const datos = { ...u, tipo_rcd: tipoMaterial(), volumen: $('r-volumen').value };
      if (!esArrojo()) Object.assign(datos, { placa: $('r-placa').value, obra_id: $('r-obra').value });
      Object.entries(datos).forEach(([k, v]) => v !== '' && d.append(k, v));
      if ($('r-foto').files[0]) d.append(esArrojo() ? 'foto' : 'foto_carga', $('r-foto').files[0]);
      $('r-guardar').disabled = true;
      if (esArrojo()) {
        const r = await post('/api/arrojos', d);
        $('r-resultado').innerHTML = `<div class="alert alert-success">Arrojo reportado.
          ${r.movimientos_cercanos.length ? `<br><b>${r.movimientos_cercanos.length} movimiento(s) sin cerrar cerca:</b>
            ${r.movimientos_cercanos.map((m) => `${esc(m.codigo)} (${esc(m.placa)}, ${num(m.distancia_m, 0)} m)`).join(', ')}` : ''}</div>`;
      } else {
        const r = await post('/api/movimientos', d);
        $('r-resultado').innerHTML = `<div class="alert alert-success">Movimiento <b>${esc(r.codigo)}</b> abierto con la placa
          ${esc(r.placa)}. El receptor lo cerrará al registrar la placa en su entrada.</div>`;
      }
      $('r-foto').value = ''; $('r-foto-ok').textContent = '';
    } catch (e) { $('r-resultado').innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`; }
    finally { $('r-guardar').disabled = false; }
  };

  // ---------------------------------------------------- M6: lista filtrable
  async function cargarViajes() {
    const q = new URLSearchParams({ estado: $('f-estado').value, obra_id: $('f-obra').value,
                                    desde: $('f-desde').value, hasta: $('f-hasta').value });
    const { movimientos } = await get('/api/movimientos?' + q);
    $('viajes-lista').innerHTML = movimientos.map((m) => `
      <a class="tarjeta d-block text-decoration-none text-body py-2" href="/m/${esc(m.codigo)}">
        <div class="d-flex justify-content-between"><b>${esc(m.codigo)}</b>${chip(m.estado)}</div>
        <div class="small">${num(m.volumen_declarado_m3)} m³ · ${esc(TIPO_CORTO[m.tipo_rcd] || m.tipo_rcd.split(':')[0])} · ${esc(m.placa)}</div>
        <div class="small text-secondary">${fecha(m.abierto_en)} · ${esc(m.obra || 'Particular')}${m.receptor ? ' → ' + esc(m.receptor) : ''}</div>
      </a>`).join('') || '<div class="text-secondary">No hay movimientos con esos filtros.</div>';
  }
  ['f-estado', 'f-obra', 'f-desde', 'f-hasta'].forEach((id) => ($(id).onchange = cargarViajes));

  // ---------------------------------------------------- M6: gráfico y tabla
  async function cargarDatos() {
    const r = await get('/api/movimientos/resumen');
    if (grafico) grafico.destroy();
    grafico = new Chart($('grafico-tipos'), {
      type: 'bar',
      data: { labels: r.por_tipo.map((t) => t.tipo_rcd.split(':')[0]),
              datasets: [{ data: r.por_tipo.map((t) => t.m3),
                           backgroundColor: r.por_tipo.map((t) => (t.categoria === 'aprovechable' ? '#1f7a4d' : '#b26a00')) }] },
      options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { title: { display: true, text: 'm³' } } } },
    });
    $('tabla-obras').innerHTML = `<table class="table tabla-compacta mb-0"><thead><tr><th>Obra</th><th class="text-end">t</th><th>Aprovechado</th></tr></thead><tbody>
      ${r.por_obra.map((o) => `<tr><td>${esc(o.obra)}</td><td class="text-end">${num(o.generado_t)}</td><td style="min-width:120px">
        <div class="progress" role="progressbar" aria-valuenow="${o.porcentaje || 0}" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar ${o.porcentaje >= o.meta_pct ? 'bg-success' : 'bg-warning'}" style="width:${o.porcentaje || 0}%">${num(o.porcentaje, 0)}%</div></div>
        <div class="small text-secondary">meta ${num(o.meta_pct, 0)}% · faltan ${num(o.falta_t)} t</div></td></tr>`).join('')}</tbody></table>`;
  }

  // ---------------------------------------------------- inicio
  (async () => {
    const u = await sesion((x) => ['conductor', 'inspector'].includes(x.perfil));
    const [o, tipos] = await Promise.all([get('/api/obras'), tiposRCD()]);
    obras = o.obras;
    $('r-obra').innerHTML = '<option value="">Particular (sin obra)</option>' +
      obras.map((x) => `<option value="${x.id}">${esc(x.nombre)}</option>`).join('');
    $('f-obra').innerHTML += obras.map((x) => `<option value="${x.id}">${esc(x.nombre)}</option>`).join('');
    tipoMaterial = chips($('r-tipos'), opcionesTipo(tipos), 3);
    selector = selectorUbicacion($('r-ubicacion'));
    if (u.perfil === 'inspector') $('que-arrojo').click();
    await cargarMapa();
  })();
</script>
</body>
</html>
