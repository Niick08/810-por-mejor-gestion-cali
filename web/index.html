<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trazabilidad RCD · Ingresar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<main class="movil" style="padding-top: 8vh">
  <div class="text-center mb-4">
    <div class="marca fs-3"><i class="bi bi-truck"></i> Trazabilidad RCD</div>
    <div class="text-secondary">Residuos de construcción y demolición · Cali</div>
  </div>

  <form id="ingreso" class="tarjeta">
    <h1 class="h5 mb-3">Ingresar</h1>
    <label class="form-label" for="email">Correo</label>
    <input class="form-control form-control-lg mb-3" id="email" type="email" autocomplete="username" required>
    <label class="form-label" for="clave">Clave</label>
    <input class="form-control form-control-lg mb-3" id="clave" type="password" autocomplete="current-password" required>
    <div class="text-danger small mb-2" id="error"></div>
    <button class="btn btn-primary btn-xl">Entrar</button>
  </form>

  <a href="/generador.html" class="tarjeta d-block text-decoration-none text-body">
    <div class="d-flex align-items-center gap-3">
      <i class="bi bi-house-door fs-2 text-success"></i>
      <div><b>¿Vas a entregar escombros de tu casa?</b><br>
        <span class="text-secondary small">Regístralos sin cuenta y recibe tu certificado.</span></div>
      <i class="bi bi-chevron-right ms-auto"></i>
    </div>
  </a>

  <div id="demo" class="tarjeta small d-none">
    <b>Modo demostración</b> · clave <code>demo1234</code>
    <div class="d-grid gap-1 mt-2" id="usuarios-demo"></div>
  </div>
</main>
<script src="/js/comun.js"></script>
<script>
  const DESTINO = { admin: '/admin.html', portero: '/portero.html', conductor: '/campo.html', inspector: '/campo.html' };
  const ir = (u) => (location.href = DESTINO[u.rol === 'admin' ? 'admin' : u.perfil]);

  get('/api/sesion').then(ir).catch(() => {});        // si ya hay sesión, entra directo

  document.getElementById('ingreso').onsubmit = async (e) => {
    e.preventDefault();
    try {
      ir(await post('/api/sesion', { email: email.value, clave: clave.value }));
    } catch (err) { document.getElementById('error').textContent = err.message; }
  };

  get('/api/publico/config').then((c) => {
    if (!c.demo) return;
    document.getElementById('demo').classList.remove('d-none');
    const usuarios = [
      ['porteria@plantasur.demo', 'Portero · Planta Sur'], ['conductor@transportes.demo', 'Conductor · Transportes'],
      ['inspector@transportes.demo', 'Inspector · Transportes'], ['admin@transportes.demo', 'Admin · Transportes'],
      ['admin@plantasur.demo', 'Admin · Planta Sur'],
    ];
    document.getElementById('usuarios-demo').innerHTML = usuarios.map(([m, t]) =>
      `<button type="button" class="btn btn-sm btn-outline-secondary text-start" data-m="${m}">${t}</button>`).join('');
    document.getElementById('usuarios-demo').onclick = (e) => {
      const b = e.target.closest('[data-m]');
      if (b) { email.value = b.dataset.m; clave.value = 'demo1234'; }
    };
  });
</script>
</body>
</html>
